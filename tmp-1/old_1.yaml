project:
  name: "ipg-ce-sw-tgw-hub"
  environments:
    test:
      vault:
        awsEngine:
          enabled: true
    dev:
      vault:
        awsEngine:
          enabled: true
  gitlab:
    samlGroupLinks:
      # iac-gitlab-ipg-ce-sw-tgw-hub-test-member
      "1ad8479e-ffb2-4523-a017-802ae375b242": "developer"
      # iac-gitlab-ipg-ce-sw-tgw-hub-dev-member
      "34ef3ce3-429e-45fc-97b5-15a3df1e55e2": "developer"
# YAML anchor definitions
.facetGroupGlobal:
  platform: "aws"
  region: "global"
  project: "tgw"
.facetGroupTestAWSGlobal:
  platform: "aws"
  region: "global"
  project: "tgw"
  environment: "test"
.facetGroupTestAWSRegional:
  platform: "aws"
  project: "tgw"
  environment: "test"
  region: "eu-west-1"
.facetGroupDevAWSGlobal:
  platform: "aws"
  region: "global"
  project: "tgw"
  environment: "dev"
.facetGroupDevAWSRegional:
  platform: "aws"
  project: "tgw"
  environment: "dev"
  region: "eu-west-1"
.workspaceBase:
  nameTemplate: "{{platform}}_{{project}}_{{region}}_{{environment}}_{{moduleName}}"
  terraformVersion: "~> 1.7.0"
  autoApply: true
.varSetRefsCommon:
  - "{{platform}}"
  - "{{platform}}/{{project}}"
  - "{{platform}}/{{project}}/{{region}}"
  - "{{platform}}/{{project}}/{{region}}/{{environment}}"
variableSetsSources:
  - "varsets/aws/account.yaml"
  - "varsets/aws/tgw/project.yaml"
  - "varsets/aws/tgw/eu-west-1/region.yaml"
  - "varsets/aws/tgw/eu-west-1/dev/environment.yaml"
  - "varsets/aws/tgw/eu-west-1/dev/tgw.yaml"
  - "varsets/aws/tgw/eu-west-1/test/environment.yaml"
  - "varsets/aws/tgw/eu-west-1/test/tgw.yaml"
workspaces:
  - nameTemplate: "{{platform}}_{{project}}_{{region}}_{{environment}}_{{moduleName}}"
    terraformVersion: "~> 1.7.0"
    autoApply: true
    moduleName: "tgw"
    facetGroups:
      - platform: "aws"
        project: "tgw"
        environment: "dev"
        region: "eu-west-1"
    vcsRepoName: "/arm-terraform-modules/CE-SW/terraform-aws-transit-gateway"
    vcsBranch: "serhe01/tgw_ram"
    allowDestroyPlan: true
    variableSetRefs:
      - - "{{platform}}"
        - "{{platform}}/{{project}}"
        - "{{platform}}/{{project}}/{{region}}"
        - "{{platform}}/{{project}}/{{region}}/{{environment}}"
      - "{{platform}}/{{project}}/{{region}}/{{environment}}/tgw"
  - nameTemplate: "{{platform}}_{{project}}_{{region}}_{{environment}}_{{moduleName}}"
    terraformVersion: "~> 1.7.0"
    autoApply: true
    moduleName: "tgw"
    facetGroups:
      - platform: "aws"
        project: "tgw"
        environment: "test"
        region: "eu-west-1"
    vcsRepoName: "/arm-terraform-modules/CE-SW/terraform-aws-transit-gateway"
    vcsBranch: "serhe01/tgw_ram"
    allowDestroyPlan: true
    variableSetRefs:
      - - "{{platform}}"
        - "{{platform}}/{{project}}"
        - "{{platform}}/{{project}}/{{region}}"
        - "{{platform}}/{{project}}/{{region}}/{{environment}}"
      - "{{platform}}/{{project}}/{{region}}/{{environment}}/tgw"
